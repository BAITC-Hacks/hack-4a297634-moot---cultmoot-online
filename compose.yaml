services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_MODE: assistant
      ALLOWED_HOSTS: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN}
      FORWARDED_ALLOW_IPS: 172.29.20.2
    volumes:
      - accounts:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      appnet:
        ipv4_address: 172.29.20.3
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8010),timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks:
      appnet:
        ipv4_address: 172.29.20.2
    depends_on: [app]
networks:
  appnet:
    ipam:
      config:
        - subnet: 172.29.20.0/24
volumes:
  accounts:
  certificates:
  caddy_config:
