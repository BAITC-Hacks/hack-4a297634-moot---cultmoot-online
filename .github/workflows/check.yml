name: Test release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: test-key-no-network
      APP_MODE: assistant
      HV_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m unittest tests.test_release.ReleaseTests tests.test_release.VoiceRelayTests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_ui.py
